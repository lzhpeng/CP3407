<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCU校园助手 | JCU Campus Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
            height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            height: 100%;
        }

        /* 认证界面样式 */
        .auth-section {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100%;
        }

        .auth-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .auth-container h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        /* 聊天界面样式 */
        .chat-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        .chat-header {
            background: #007bff;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h1 {
            margin: 0;
            font-size: 1.5rem;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .header-actions button {
            transition: all 0.3s ease;
        }

        .header-actions button:hover {
            transform: scale(1.05);
            background-color: rgba(255, 255, 255, 0.2);
        }

        #clearChat {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        #clearChat:hover {
            background-color: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            margin-bottom: 15px;
            padding: 10px 15px;
            border-radius: 10px;
            max-width: 80%;
        }

        .message.bot {
            background: #f0f2f5;
            margin-right: auto;
        }

        .message.user {
            background: #007bff;
            color: white;
            margin-left: auto;
        }

        .message.follow-up {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 15px;
        }

        .follow-up button {
            color: #007bff;
            padding: 0;
            text-align: left;
        }

        .chat-input {
            padding: 20px;
            background: #f8f9fa;
            border-top: 1px solid #dee2e6;
        }

        .chat-input .input-group {
            max-width: 100%;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .message {
                max-width: 90%;
            }
        }

        /* 工具类 */
        .d-none {
            display: none !important;
        }

        /* 滚动条样式 */
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 3px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        .student-id-feedback {
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }
        .text-success {
            color: #198754;
        }
        .text-danger {
            color: #dc3545;
        }
    </style>

    <!-- PWA支持 -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#007bff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="JCU助手">
    <link rel="apple-touch-icon" href="/static/icons/icon-152x152.png">

    <script>
        // 用户数据存储
        const USERS_KEY = 'jcu_users';
        let users = [];
        let currentUser = null;

        // 从localStorage加载用户数据
        function loadUsers() {
            try {
                const savedUsers = localStorage.getItem(USERS_KEY);
                if (savedUsers) {
                    users = JSON.parse(savedUsers);
                } else {
                    users = [];
                    saveUsers();
                }
            } catch (error) {
                console.error('加载用户数据失败:', error);
                users = [];
                saveUsers();
            }
        }

        // 保存用户数据到localStorage
        function saveUsers() {
            try {
                localStorage.setItem(USERS_KEY, JSON.stringify(users));
            } catch (error) {
                console.error('保存用户数据失败:', error);
                alert('保存用户数据失败，请检查浏览器存储空间');
            }
        }

        // 重置数据库
        function resetDatabase() {
            if (confirm('确定要重置所有用户数据吗？此操作不可恢复！\nAre you sure to reset all user data? This action cannot be undone!')) {
                // 清除本地存储
                localStorage.removeItem(USERS_KEY);
                // 重置用户数组
                users = [];
                // 保存空数组到本地存储
                saveUsers();
                // 显示成功消息
                alert('数据已重置！请重新注册账号。\nData has been reset! Please register a new account.');
                // 返回登录页面
                handleLogout();
            }
        }

        // 页面加载时读取用户数据
        window.addEventListener('load', () => {
            loadUsers();
            // 初始化所有tooltips
            var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
            var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
                return new bootstrap.Tooltip(tooltipTriggerEl);
            });
        });

        let currentLanguage = 'zh';

        // 显示登录界面
        function showLoginSection() {
            document.getElementById('registerSection').classList.add('d-none');
            document.getElementById('loginSection').classList.remove('d-none');
            document.getElementById('chatSection').classList.add('d-none');
        }

        // 显示注册界面
        function showRegisterSection() {
            document.getElementById('loginSection').classList.add('d-none');
            document.getElementById('registerSection').classList.remove('d-none');
            document.getElementById('chatSection').classList.add('d-none');
        }

        // 显示聊天界面
        function showChatSection() {
            document.getElementById('loginSection').classList.add('d-none');
            document.getElementById('registerSection').classList.add('d-none');
            document.getElementById('chatSection').classList.remove('d-none');
            showWelcomeMessage();
        }

        // 显示错误消息
        function showError(zhMessage, enMessage) {
            alert(`${zhMessage}\n${enMessage}`);
        }

        // 获取所有用户
        function getUsers() {
            return users;
        }

        // 检查学号状态并显示提示
        function checkStudentIdStatus(inputElement) {
            const studentId = inputElement.value;
            const feedbackDiv = inputElement.nextElementSibling;

            // 如果还没有输入完8位数字，不显示任何提示
            if (studentId.length !== 8) {
                if (feedbackDiv && feedbackDiv.classList.contains('student-id-feedback')) {
                    feedbackDiv.remove();
                }
                return;
            }

            // 创建或更新反馈信息div
            let feedback;
            if (feedbackDiv && feedbackDiv.classList.contains('student-id-feedback')) {
                feedback = feedbackDiv;
            } else {
                feedback = document.createElement('div');
                feedback.className = 'student-id-feedback';
                inputElement.parentNode.insertBefore(feedback, inputElement.nextSibling);
            }

            // 检查学号格式
            if (!/^\d{8}$/.test(studentId)) {
                feedback.className = 'student-id-feedback text-danger';
                feedback.textContent = '学号必须是8位数字 | Student ID must be 8 digits';
                return;
            }

            // 检查学号是否已注册
            const isRegistered = users.some(user => user.studentId === studentId);

            // 根据不同场景显示不同提示
            if (inputElement.id === 'registerStudentId') {
                // 注册页面
                if (isRegistered) {
                    feedback.className = 'student-id-feedback text-danger';
                    feedback.textContent = '✗ 该学号已被注册，请直接登录 | This student ID is already registered, please login';
                } else {
                    feedback.className = 'student-id-feedback text-success';
                    feedback.textContent = '✓ 该学号可以注册 | This student ID is available for registration';
                }
            } else {
                // 登录页面
                if (!isRegistered) {
                    feedback.className = 'student-id-feedback text-danger';
                    feedback.textContent = '✗ 该学号未注册，请先注册账号 | This student ID is not registered, please register first';
                } else {
                    feedback.className = 'student-id-feedback text-success';
                    feedback.textContent = '✓ 该学号已注册，请输入密码 | Student ID found, please enter your password';
                }
            }
        }

        // 检查邮箱状态并显示提示
        function checkEmailStatus(inputElement) {
            const email = inputElement.value;
            const feedbackDiv = inputElement.nextElementSibling;

            // 创建或更新反馈信息div
            let feedback;
            if (feedbackDiv && feedbackDiv.classList.contains('student-id-feedback')) {
                feedback = feedbackDiv;
            } else {
                feedback = document.createElement('div');
                feedback.className = 'student-id-feedback';
                inputElement.parentNode.insertBefore(feedback, inputElement.nextSibling);
            }

            // 检查邮箱格式
            if (!email.endsWith('@my.jcu.edu.au')) {
                feedback.className = 'student-id-feedback text-danger';
                feedback.textContent = '✗ 请使用JCU邮箱（@my.jcu.edu.au） | Please use JCU email (@my.jcu.edu.au)';
                return;
            }

            // 检查邮箱是否已被使用
            const isEmailUsed = users.some(user => user.email === email);
            if (isEmailUsed) {
                feedback.className = 'student-id-feedback text-danger';
                feedback.textContent = '✗ 该邮箱已被使用 | This email is already in use';
            } else {
                feedback.className = 'student-id-feedback text-success';
                feedback.textContent = '✓ 该邮箱可以使用 | This email is available';
            }
        }

        // 处理登录
        function handleLogin() {
            const studentId = document.getElementById('loginStudentId').value;
            const password = document.getElementById('loginPassword').value;

            const user = users.find(u => u.studentId === studentId && u.password === password);

            if (user) {
                currentUser = user;
                // 清空聊天记录并显示新的欢迎消息
                const chatMessages = document.getElementById('chatMessages');
                chatMessages.innerHTML = '';
                showChatSection();
                return false; // 防止表单默认提交
            } else {
                showError('学号或密码错误', 'Invalid student ID or password');
                return false; // 防止表单默认提交
            }
        }

        // 处理注册
        function handleRegister() {
            const studentId = document.getElementById('registerStudentId').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('registerConfirmPassword').value;

            // 验证密码
            if (password !== confirmPassword) {
                showError('两次输入的密码不一致', 'Passwords do not match');
                return;
            }

            // 验证学号是否已注册
            if (users.some(user => user.studentId === studentId)) {
                showError('该学号已注册', 'This student ID is already registered');
                return;
            }

            // 验证邮箱是否已使用
            if (users.some(user => user.email === email)) {
                showError('该邮箱已被使用', 'This email is already in use');
                return;
            }

            // 创建新用户
            const newUser = {
                studentId,
                email,
                password
            };

            users.push(newUser);
            saveUsers(); // 保存到localStorage
            currentUser = newUser;
            showChatSection();
        }

        // 处理登出
        function handleLogout() {
            currentUser = null;
            showLoginSection();
        }

        // 增强的AI配置
        const aiConfig = {
            context: {
                conversationHistory: [],
                userPreferences: {
                    program: '',  // 用户专业
                    level: '',    // 本科/研究生
                    interests: [] // 兴趣爱好
                },
                currentTime: new Date(),
                maxHistory: 10
            },

            // 智能分析系统
            analyzer: {
                // 获取当前时间相关信息
                getTimeContext() {
                    const hour = new Date().getHours();
                    const isWeekend = [0, 6].includes(new Date().getDay());
                    return {
                        timeOfDay: hour < 12 ? 'morning' : (hour < 18 ? 'afternoon' : 'evening'),
                        isWeekend: isWeekend,
                        isBusinessHours: hour >= 8 && hour < 18 && !isWeekend
                    };
                },

                // 分析用户情绪
                analyzeMood(message) {
                    const positiveWords = /(开心|高兴|好|happy|great|good|excellent)/i;
                    const negativeWords = /(难过|伤心|压力|烦恼|sad|stress|worried|anxiety)/i;
                    const urgentWords = /(急|紧急|马上|立即|urgent|asap|immediately)/i;

                    return {
                        isPositive: positiveWords.test(message),
                        isNegative: negativeWords.test(message),
                        isUrgent: urgentWords.test(message)
                    };
                },

                // 提取关键信息
                extractKeyInfo(message) {
                    const timePatterns = /(今天|明天|下周|周末|today|tomorrow|next week|weekend)/i;
                    const locationPatterns = /(在哪|怎么去|位置|where|location|how to get)/i;
                    const servicePatterns = /(如何|怎么|帮助|how|help|service)/i;

                    return {
                        hasTimeQuery: timePatterns.test(message),
                        hasLocationQuery: locationPatterns.test(message),
                        hasServiceQuery: servicePatterns.test(message)
                    };
                }
            },

            // 智能回复生成
            responseGenerator: {
                // 生成情境建议
                generateContextualSuggestions(category) {
                    const time = aiConfig.analyzer.getTimeContext();
                    const suggestions = {
                        'library': {
                            morning: '早上图书馆人较少，是学习的好时机 | Library is less crowded in the morning, perfect for studying',
                            afternoon: '下午图书馆会较拥挤，建议提前预订座位 | Library gets crowded in the afternoon, booking recommended',
                            evening: '晚上24小时自习室开放 | 24-hour study room is available at night'
                        },
                        'transportation': {
                            morning: '早高峰建议提前出发 | Please allow extra time during morning peak',
                            afternoon: '午后交通顺畅 | Traffic is smooth in the afternoon',
                            evening: '晚高峰期间建议使用穿梭巴士 | Shuttle bus recommended during evening peak'
                        },
                        'services': {
                            morning: '早上服务中心人流较少 | Service center is less crowded in the morning',
                            afternoon: '下午是办理业务高峰期 | Peak hours for services in the afternoon',
                            evening: '建议使用在线服务 | Online services recommended'
                        }
                    };
                    return suggestions[category]?.[time.timeOfDay] || '';
                },

                // 生成相关推荐
                generateRelatedTopics(category) {
                    const relatedTopics = {
                        'library': ['自习室预订', '打印服务', '电子资源访问',
                                  'Study room booking', 'Printing service', 'E-resources access'],
                        'transportation': ['校车时刻表', '停车信息', '实时交通状况',
                                         'Shuttle schedule', 'Parking info', 'Real-time traffic'],
                        'services': ['学生证办理', '成绩单申请', '住宿咨询',
                                   'Student ID', 'Transcript', 'Accommodation']
                    };
                    return relatedTopics[category] || [];
                }
            }
        };

        // 增强的消息处理系统
        function processMessage(message) {
            // 保存对话历史
            aiConfig.context.conversationHistory.push({
                role: 'user',
                content: message,
                timestamp: new Date().getTime()
            });

            // 限制历史记录长度
            if (aiConfig.context.conversationHistory.length > aiConfig.context.maxHistory) {
                aiConfig.context.conversationHistory.shift();
            }

            // 分析用户输入
            const mood = aiConfig.analyzer.analyzeMood(message);
            const keyInfo = aiConfig.analyzer.extractKeyInfo(message);
            const timeContext = aiConfig.analyzer.getTimeContext();

            // 获取基础回答
            let response = analyzeQuestion(message);

            // 如果找到了基础回答，增加情境建议
            if (response && !response.includes('抱歉')) {
                const category = determineCategory(message);
                const contextualSuggestion = aiConfig.responseGenerator.generateContextualSuggestions(category);
                const relatedTopics = aiConfig.responseGenerator.generateRelatedTopics(category);

                // 组合完整回答
                if (contextualSuggestion) {
                    response += '\n\n💡 温馨提示 | Friendly Reminder:\n' + contextualSuggestion;
                }

                if (relatedTopics.length > 0) {
                    response += '\n\n📌 您可能还想了解 | You might also want to know:\n' +
                              relatedTopics.map(topic => '• ' + topic).join('\n');
                }

                // 如果检测到负面情绪，添加支持性话语
                if (mood.isNegative) {
                    response += '\n\n🤗 需要更多帮助吗？我随时在这里！| Need more help? I\'m always here!';
                }

                // 如果是紧急查询，添加紧急联系方式
                if (mood.isUrgent) {
                    response += '\n\n⚡ 紧急联系 | Emergency Contact:\n' +
                              '电话 | Phone: +65 6709 3888\n' +
                              '24小时服务热线 | 24/7 Hotline: +65 6709 3999';
                }
            }

            return response;
        }

        // 确定查询类别
        function determineCategory(message) {
            const categories = {
                library: /(图书馆|library|book|study)/i,
                transportation: /(交通|bus|shuttle|parking)/i,
                services: /(服务|咨询|service|help|support)/i
            };

            for (const [category, pattern] of Object.entries(categories)) {
                if (pattern.test(message)) {
                    return category;
                }
            }
            return '';
        }

        // 智能意图分析
        function analyzeIntent(message) {
            const normalizedMsg = message.toLowerCase();

            // 首先检查是否是问候语
            const greetingPatterns = {
                zh: /(你好|早上好|下午好|晚上好|嗨|哈喽|您好)/,
                en: /(hi|hello|hey|good morning|good afternoon|good evening)/
            };

            if (greetingPatterns[currentLanguage].test(normalizedMsg)) {
                const greetings = {
                    zh: [
                        '你好！很高兴见到你！请问有什么我可以帮你的吗？',
                        '你好啊！今天有什么问题想问我吗？',
                        '嗨！欢迎来到JCU校园助手，我可以帮你了解：\n- 学术日历信息\n- 交通出行信息\n- 校园设施信息\n- 学生服务信息\n- 近期活动信息'
                    ],
                    en: [
                        'Hello! Nice to meet you! How can I help you today?',
                        'Hi there! What questions do you have for me?',
                        'Hey! Welcome to JCU Campus Assistant, I can help you with:\n- Academic Calendar\n- Transportation\n- Campus Facilities\n- Student Services\n- Current Events'
                    ]
                };
                return greetings[currentLanguage][Math.floor(Math.random() * greetings[currentLanguage].length)];
            }

            // 如果不是通用对话，进行专业问答
            return analyzeQuestion(message);
        }

        // 处理通用对话
        function handleGeneralDialog(intent) {
            const responses = {
                greeting: {
                    zh: ['你好！很高兴见到你！', '嗨！有什么我可以帮你的吗？', '你好啊！今天过得怎么样？'],
                    en: ['Hello! Nice to meet you!', 'Hi! How can I help you?', 'Hey there! How\'s your day?']
                },
                thanks: {
                    zh: ['不客气！', '很高兴能帮到你！', '随时都可以问我问题哦！'],
                    en: ['You\'re welcome!', 'Glad I could help!', 'Feel free to ask me anything!']
                },
                goodbye: {
                    zh: ['再见！祝你有愉快的一天！', '下次见！', '随时都可以回来找我聊天哦！'],
                    en: ['Goodbye! Have a great day!', 'See you next time!', 'Feel free to come back anytime!']
                },
                help: {
                    zh: ['我可以帮你：\n1. 解答JCU相关问题\n2. 提供学习建议\n3. 闲聊解压\n请告诉我你需要什么帮助！'],
                    en: ['I can help you with:\n1. JCU related questions\n2. Study advice\n3. Casual chat\nJust let me know what you need!']
                },
                mood: {
                    zh: ['希望你心情愉快！我随时在这里陪你聊天。', '分享快乐会加倍，分担烦恼会减半！'],
                    en: ['Hope you\'re feeling great! I\'m always here to chat.', 'Sharing joy doubles it, sharing worries halves them!']
                }
            };

            const responseList = responses[intent][currentLanguage];
            return responseList[Math.floor(Math.random() * responseList.length)];
        }

        // 添加消息到聊天界面
        function addMessage(message, type = 'bot') {
            const chatMessages = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;

            if (typeof message === 'object') {
                if (message.main_response) {
                    const mainResponseDiv = document.createElement('div');
                    mainResponseDiv.textContent = message.main_response;
                    messageDiv.appendChild(mainResponseDiv);
                }

                if (message.follow_up_questions && message.follow_up_questions.length > 0) {
                    const followUpDiv = document.createElement('div');
                    followUpDiv.className = 'follow-up';
                    followUpDiv.innerHTML = message.follow_up_questions.map(q =>
                        `<button class="btn btn-link" onclick="handleFollowUp('${encodeURIComponent(q)}')">${escapeHtml(q)}</button>`
                    ).join('<br>');
                    messageDiv.appendChild(followUpDiv);
                }
            } else {
                messageDiv.textContent = message;
            }

            chatMessages.appendChild(messageDiv);
            messageDiv.scrollIntoView({ behavior: 'smooth' });
        }

        // HTML转义函数
        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // 升级后的发送消息函数
        async function sendMessage(event) {
            event.preventDefault();
            const messageInput = document.getElementById('messageInput');
            const message = messageInput.value.trim();

            if (!message) return;

            // 显示用户消息
            addMessage(message, 'user');
            messageInput.value = '';

            // 处理消息并获取回复
            const response = processMessage(message);

            // 添加AI回复
            setTimeout(() => {

        // 升级的智能问答系统
        function analyzeQuestion(question) {
            // 移除标点符号，转换为小写
            const normalizedQuestion = question.toLowerCase().replace(/[.,?!]/g, '');

            // 首先检查是否是问候语
            const greetingPatterns = {
                zh: /(你好|早上好|下午好|晚上好|嗨|哈喽|您好)/,
                en: /(hi|hello|hey|good morning|good afternoon|good evening)/
            };

            if (greetingPatterns[currentLanguage].test(normalizedQuestion)) {
                const greetings = {
                    zh: [
                        '你好！很高兴见到你！请问有什么我可以帮你的吗？',
                        '你好啊！今天有什么问题想问我吗？',
                        '嗨！欢迎来到JCU校园助手，我可以帮你了解：\n- 学术日历信息\n- 交通出行信息\n- 校园设施信息\n- 学生服务信息\n- 近期活动信息'
                    ],
                    en: [
                        'Hello! Nice to meet you! How can I help you today?',
                        'Hi there! What questions do you have for me?',
                        'Hey! Welcome to JCU Campus Assistant, I can help you with:\n- Academic Calendar\n- Transportation\n- Campus Facilities\n- Student Services\n- Current Events'
                    ]
                };
                return greetings[currentLanguage][Math.floor(Math.random() * greetings[currentLanguage].length)];
            }

            // 智能关键词映射
            const smartKeywords = {
                // 学期相关
                '(什么时候|几号|几点)*(开学|放假|考试|学期)': ['academic_calendar', 'academic_year'],
                '(when|what time|date)*(term|semester|exam|break|study)': ['academic_calendar', 'academic_year'],
                '(重要|截止|最后)*(日期|时间|期限)': ['academic_calendar', 'important_dates'],
                '(important|deadline|due|last)*(date|time|day)': ['academic_calendar', 'important_dates'],

                // 交通相关
                '(怎么|如何)*(去|到|达|找)*学校': ['transportation', 'to_campus'],
                '(how|where|way)*(to|get|reach|find)*campus': ['transportation', 'to_campus'],
                '(校车|巴士|班车|shuttle)*(时间|班次|路线)': ['transportation', 'shuttle_bus'],
                '(shuttle|bus)*(time|schedule|route)': ['transportation', 'shuttle_bus'],

                // 设施相关
                '图书馆*(时间|开放|位置|在哪)': ['campus_facilities', 'library'],
                '(library)*(time|open|location|where|hour)': ['campus_facilities', 'library'],

                // 服务相关
                '(学生服务|学生中心|服务中心|student service)': ['student_services', 'student_central'],
                '(学习|辅导|工作坊|tutoring|workshop)': ['student_services', 'student_central'],
                '(职业|简历|实习|career|resume|intern)': ['student_services', 'student_central'],
                '(住宿|社团|心理|accommodation|club|counseling)': ['student_services', 'student_central'],
                '(证明|学生证|成绩单|id card|transcript)': ['student_services', 'student_central'],

                // 活动相关
                '(最近|近期|现在|目前)*(活动|事件|讲座)': ['current_events', 'events'],
                '(current|recent|upcoming|now)*(event|activity|seminar)': ['current_events', 'events'],

                // 课程相关
                '(课程|专业|学位|本科|研究生|博士)': ['courses', 'programs'],
                '(course|program|degree|bachelor|master|phd)': ['courses', 'programs'],
                '(商科|工商|会计|金融|business|accounting|finance)': ['courses', 'programs'],
                '(信息技术|计算机|it|computer|technology)': ['courses', 'programs'],
                '(教育|幼教|education|teaching)': ['courses', 'programs'],
            };

            // 智能匹配
            for (const [pattern, [category, subcategory]] of Object.entries(smartKeywords)) {
                const regex = new RegExp(pattern);
                if (regex.test(normalizedQuestion)) {
                    const answer = qaData[category][subcategory];
                    return currentLanguage === 'zh' ? answer.zh : answer.en;
                }
            }

            // 如果没有匹配到，返回智能提示
            return currentLanguage === 'zh' ?
                '抱歉，我不太理解您的问题。您可以尝试：\n1. 更具体地描述您的需求\n2. 使用关键词，如"开学时间"、"图书馆位置"等\n3. 选择以下类别：\n- 学术日历\n- 交通信息\n- 校园设施\n- 学生服务\n- 近期活动' :
                'Sorry, I don\'t quite understand. You can try:\n1. Being more specific\n2. Using keywords like "term dates", "library location"\n3. Choose from these categories:\n- Academic Calendar\n- Transportation\n- Campus Facilities\n- Student Services\n- Current Events';
        }

        // 添加实时信息更新功能
        function updateRealTimeInfo() {
            const now = new Date();
            const day = now.getDay(); // 0-6, 0是周日
            const hour = now.getHours();
            const minute = now.getMinutes();

            // 更新图书馆状态
            if (day >= 1 && day <= 5) { // 周一到周五
                if (hour >= 8 && (hour < 22 || (hour === 22 && minute === 0))) {
                    qaData.campus_facilities.library.status = '开放中 | Open';
                } else {
                    qaData.campus_facilities.library.status = '已关闭 | Closed';
                }
            } else { // 周末
                if (hour >= 9 && (hour < 18 || (hour === 18 && minute === 0))) {
                    qaData.campus_facilities.library.status = '开放中 | Open';
                } else {
                    qaData.campus_facilities.library.status = '已关闭 | Closed';
                }
            }

            // 更新穿梭巴士状态
            if (day >= 1 && day <= 5) { // 周一到周五
                if (hour >= 7 && (hour < 22 || (hour === 22 && minute <= 30))) {
                    qaData.transportation.shuttle_bus.status = '运行中 | Operating';
                } else {
                    qaData.transportation.shuttle_bus.status = '已停运 | Not Operating';
                }
            } else { // 周末
                if (hour >= 9 && (hour < 18 || (hour === 18 && minute === 0))) {
                    qaData.transportation.shuttle_bus.status = '运行中 | Operating';
                } else {
                    qaData.transportation.shuttle_bus.status = '已停运 | Not Operating';
                }
            }
        }

        // 每分钟更新一次实时信息
        setInterval(updateRealTimeInfo, 60000);
        // 初始化时也更新一次
        updateRealTimeInfo();
    </script>

                               data-bs-toggle="tooltip"
                               data-bs-placement="top"
                               title="至少8个字符，包含大小写字母和数字 | Min 8 chars, with upper, lower & numbers"
                               placeholder="至少8个字符，包含大小写字母和数字 | Min 8 chars, with upper, lower & numbers"
                               required>
                    </div>
                    <div class="mb-3">
                        <label for="registerConfirmPassword" class="form-label">确认密码 | Confirm Password:</label>
                        <input type="password" class="form-control" id="registerConfirmPassword"
                               data-bs-toggle="tooltip"
                               data-bs-placement="top"
                               title="请再次输入密码 | Please re-enter your password"
                               placeholder="请再次输入密码 | Re-enter your password"
                               required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">注册 | Register</button>
                    <div class="mt-3 text-center">
                        <a href="#" onclick="showLoginSection()">已有账号？| Already have an account?</a>
                    </div>
                </form>
            </div>
        </div>

        <!-- 聊天界面 -->
        <div id="chatSection" class="chat-container d-none">
            <div class="chat-header">
                <h1>JCU校园助手 | JCU Campus Assistant</h1>
                <div class="header-actions">
                    <button class="btn btn-outline-light btn-sm" id="clearChat" onclick="clearChat()">清空聊天 | Clear Chat</button>
                    <button class="btn btn-outline-light btn-sm" id="langButton" onclick="toggleLanguage()">English</button>
                    <button class="btn btn-outline-light btn-sm" onclick="handleLogout()">退出登录 | Logout</button>
                    <button class="btn btn-danger btn-sm" onclick="resetDatabase()">重置数据 | Reset Data</button>
                </div>
            </div>
            <div class="chat-messages" id="chatMessages">
                <!-- 消息将在这里动态添加 -->
            </div>
            <div class="chat-input">
                <form id="chatForm" onsubmit="return sendMessage(event)">
                    <div class="input-group">
                        <input type="text" class="form-control" id="messageInput"
                               required>
                        <button type="submit" class="btn btn-primary">发送 | Send</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
