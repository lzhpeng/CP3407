<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCU校园助手 | JCU Campus Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/chat.css" rel="stylesheet">
    
    <!-- PWA支持 -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#007bff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="JCU助手">
    <link rel="apple-touch-icon" href="/static/icons/icon-152x152.png">
    
    <script>
        // 注册Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/static/sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful');
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>
</head>
<body>
    <div class="container">
        <!-- 登录界面 -->
        <div id="loginSection" class="auth-section">
            <div class="auth-container">
                <h2>登录 | Login</h2>
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="loginStudentId" class="form-label">学号 | Student ID:</label>
                        <input type="text" class="form-control" id="loginStudentId" pattern="[0-9]{8}" title="请输入8位数字学号 | Please enter 8-digit student ID" required>
                    </div>
                    <div class="mb-3">
                        <label for="loginPassword" class="form-label">密码 | Password:</label>
                        <input type="password" class="form-control" id="loginPassword" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">登录 | Login</button>
                    <div class="mt-3 text-center">
                        <a href="#" onclick="showRegisterSection()">还没有账号？| Don't have an account?</a>
                    </div>
                </form>
            </div>
        </div>

        <!-- 注册界面 -->
        <div id="registerSection" class="auth-section d-none">
            <div class="auth-container">
                <h2>注册 | Register</h2>
                <form id="registerForm" onsubmit="return register(event)">
                    <div class="mb-3">
                        <label for="registerStudentId" class="form-label">学号 | Student ID:</label>
                        <input type="text" class="form-control" id="registerStudentId" pattern="[0-9]{8}" title="请输入8位数字学号 | Please enter 8-digit student ID" required>
                    </div>
                    <div class="mb-3">
                        <label for="registerEmail" class="form-label">邮箱 | Email:</label>
                        <input type="email" class="form-control" id="registerEmail" required pattern=".*@my\.jcu\.edu\.au$" title="请使用JCU邮箱 (@my.jcu.edu.au) | Please use JCU email (@my.jcu.edu.au)">
                    </div>
                    <div class="mb-3">
                        <label for="registerPassword" class="form-label">密码 | Password:</label>
                        <input type="password" class="form-control" id="registerPassword" 
                               minlength="8"
                               required title="密码必须包含大小写字母和数字 | Password must contain uppercase, lowercase letters and numbers">
                    </div>
                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">确认密码 | Confirm Password:</label>
                        <input type="password" class="form-control" id="confirmPassword" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">注册 | Register</button>
                    <div class="mt-3 text-center">
                        <a href="#" onclick="showLoginSection()">已有账号？| Already have an account?</a>
                    </div>
                </form>
            </div>
        </div>

        <!-- 聊天界面 -->
        <div id="chatSection" class="chat-container d-none">
            <div class="chat-header">
                <h1>JCU校园助手 | JCU Campus Assistant</h1>
                <div class="header-actions">
                    <button class="btn btn-outline-light btn-sm" id="clearChat" onclick="clearChat()">清空聊天 | Clear Chat</button>
                    <button class="btn btn-outline-light btn-sm" id="langButton" onclick="toggleLanguage()">English</button>
                    <button class="btn btn-outline-light btn-sm" onclick="logout()">退出登录 | Logout</button>
                </div>
            </div>
            <div class="chat-messages" id="chatMessages">
                <!-- 消息将在这里动态添加 -->
            </div>
            <div class="chat-input">
                <form id="chatForm" onsubmit="return sendMessage(event)">
                    <div class="input-group">
                        <input type="text" class="form-control" id="messageInput" placeholder="请输入您的问题... | Enter your question..." required>
                        <button type="submit" class="btn btn-primary">发送 | Send</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/chat.js"></script>
</body>
</html>
