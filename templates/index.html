<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCU事件管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">JCU事件管理</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item" id="loginNav">
                        <a class="nav-link" href="#" onclick="showLoginForm()">登录</a>
                    </li>
                    <li class="nav-item" id="registerNav">
                        <a class="nav-link" href="#" onclick="showRegisterForm()">注册</a>
                    </li>
                    <li class="nav-item d-none" id="logoutNav">
                        <a class="nav-link" href="#" onclick="logout()">退出</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- 登录表单 -->
        <div id="loginForm" class="auth-form">
            <h2>登录</h2>
            <form onsubmit="return login(event)">
                <div class="mb-3">
                    <label for="loginUsername" class="form-label">用户名</label>
                    <input type="text" class="form-control" id="loginUsername" required>
                </div>
                <div class="mb-3">
                    <label for="loginPassword" class="form-label">密码</label>
                    <input type="password" class="form-control" id="loginPassword" required>
                </div>
                <button type="submit" class="btn btn-primary">登录</button>
            </form>
        </div>

        <!-- 注册表单 -->
        <div id="registerForm" class="auth-form d-none">
            <h2>注册</h2>
            <form onsubmit="return register(event)">
                <div class="mb-3">
                    <label for="registerUsername" class="form-label">用户名</label>
                    <input type="text" class="form-control" id="registerUsername" required>
                </div>
                <div class="mb-3">
                    <label for="registerEmail" class="form-label">邮箱</label>
                    <input type="email" class="form-control" id="registerEmail" required>
                </div>
                <div class="mb-3">
                    <label for="registerPassword" class="form-label">密码</label>
                    <input type="password" class="form-control" id="registerPassword" required>
                </div>
                <button type="submit" class="btn btn-primary">注册</button>
            </form>
        </div>

        <!-- 事件列表 -->
        <div id="eventList" class="d-none">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>事件列表</h2>
                <button class="btn btn-primary" onclick="showCreateEventForm()">创建新事件</button>
            </div>
            <div id="events"></div>
        </div>

        <!-- 创建事件表单 -->
        <div id="createEventForm" class="d-none">
            <h2>创建新事件</h2>
            <form onsubmit="return createEvent(event)">
                <div class="mb-3">
                    <label for="eventName" class="form-label">事件名称</label>
                    <input type="text" class="form-control" id="eventName" required>
                </div>
                <div class="mb-3">
                    <label for="eventDate" class="form-label">事件日期</label>
                    <input type="datetime-local" class="form-control" id="eventDate" required>
                </div>
                <div class="mb-3">
                    <label for="eventLocation" class="form-label">地点</label>
                    <input type="text" class="form-control" id="eventLocation" required>
                </div>
                <div class="mb-3">
                    <label for="eventDescription" class="form-label">描述</label>
                    <textarea class="form-control" id="eventDescription" rows="3" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">创建</button>
                <button type="button" class="btn btn-secondary" onclick="showEventList()">返回</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
